spring.application.name=microservice-monitoring-proxy
server.port=${PORT:8080}

# Supabase PostgreSQL Connection (Session Pooler IPv4 compatible)
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:5432/postgres}
spring.datasource.username=${DB_USER:postgres.your_project_ref}
spring.datasource.password=${DB_PASSWORD:your_supabase_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
